# Builds a release zip whenever a version tag (e.g. v2.1.0) is pushed.
#
# Without any secrets it creates a GitHub release with the zip attached.
# To also upload to CurseForge / Wago:
#   1. Create the project on the site and add its ID to eSaithBagFilter.toc:
#        ## X-Curse-Project-ID: 123456
#        ## X-Wago-ID: abcdef12
#   2. Add the API keys as repository secrets named CF_API_KEY and WAGO_API_TOKEN.

name: Package and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
